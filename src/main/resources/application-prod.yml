# 운영. 로그는 파일만(logback-spring.xml 의 prod 프로필). 앱 INFO, 프레임워크 WARN.
spring:
  # DB 접속 정보는 환경 변수로만 받는다 — 기본값 없음(없으면 기동 실패). 비밀번호를 이 파일에 적지 않는다.
  #   SPRING_DATASOURCE_URL      예) jdbc:oracle:thin:@prod-db.example.local:1521/KBFIDO
  #   SPRING_DATASOURCE_USERNAME
  #   SPRING_DATASOURCE_PASSWORD
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: fido-admin-prod
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000       # 운영은 빨리 실패해 사용자에게 오류를 돌려준다(ms)
      validation-timeout: 3000
      idle-timeout: 600000           # 10분
      max-lifetime: 1800000          # 30분 — DB·방화벽의 유휴 연결 끊김보다 짧게
      connection-test-query: SELECT 1 FROM DUAL
  jpa:
    show-sql: false
  thymeleaf:
    cache: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
logging:
  level:
    com.crosscert.fidoadmin: info
    org.springframework: warn
    org.hibernate: warn
