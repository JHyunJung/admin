<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '데모 접근코드 등록' : '데모 접근코드 수정'">데모 접근코드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '데모 접근코드 등록' : '데모 접근코드 수정', null)}"></div>
  <form th:action="${isNew} ? @{/fido2/demo-access-codes} : @{/fido2/demo-access-codes/{id}(id=${id})}" th:object="${form}" method="post" class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="accesscode">코드<span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <!-- 할당형 PK: 수정 시에는 바꿀 수 없다. -->
          <input th:field="*{accesscode}" class="form-control fa-mono" th:readonly="${!isNew}" th:classappend="${#fields.hasErrors('accesscode')} ? 'is-invalid'">
          <div class="form-text">영문, 숫자, 마침표(.), 밑줄(_), 하이픈(-) 만 사용할 수 있습니다.</div>
          <div class="invalid-feedback" th:errors="*{accesscode}"></div>
        </div>
        <div class="col-md-6"><label class="form-label" for="vendorname">벤더</label><input th:field="*{vendorname}" class="form-control"></div>
        <div class="col-md-6"><label class="form-label" for="starttime">시작일시</label><input type="datetime-local" step="1" th:field="*{starttime}" class="form-control"></div>
        <div class="col-md-6">
          <label class="form-label" for="endtime">종료일시</label>
          <input type="datetime-local" step="1" th:field="*{endtime}" class="form-control" th:classappend="${#fields.hasErrors('endtime')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{endtime}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="status">상태<span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <select th:field="*{status}" class="form-select"><option value="E">E (활성)</option><option value="D">D (만료)</option></select>
        </div>
        <div class="col-12"><label class="form-label" for="note">비고</label><input th:field="*{note}" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="etc">기타</label><textarea th:field="*{etc}" rows="3" class="form-control"></textarea></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/fido2/demo-access-codes} : @{/fido2/demo-access-codes/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
