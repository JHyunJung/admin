<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO2 데모 접근코드 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/fido2/demo-access-codes}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|데모 접근코드 ${item.accesscode}|">데모 접근코드</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/fido2/demo-access-codes/{id}/edit(id=${item.accesscode})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/fido2/demo-access-codes/{id}/delete(id=${item.accesscode})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: infoRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="infoRows">
  <tr><th>코드</th><td class="fa-mono" th:text="${item.accesscode}"></td></tr>
  <tr><th>벤더</th><td th:text="${item.vendorname}"></td></tr>
  <tr><th>시작일시</th><td><span class="fa-mono" th:text="${item.startAt == null} ? '' : ${#temporals.format(item.startAt, 'yyyy-MM-dd HH:mm:ss')}"></span> <small class="text-secondary fa-mono" th:if="${item.starttime != null}" th:text="|(epoch ${item.starttime})|"></small></td></tr>
  <tr><th>종료일시</th><td><span class="fa-mono" th:text="${item.endAt == null} ? '' : ${#temporals.format(item.endAt, 'yyyy-MM-dd HH:mm:ss')}"></span> <small class="text-secondary fa-mono" th:if="${item.endtime != null}" th:text="|(epoch ${item.endtime})|"></small></td></tr>
  <tr><th>상태</th><td th:text="${item.status}"></td></tr>
  <tr><th>비고</th><td class="fa-pre" th:text="${item.note}"></td></tr>
  <tr><th>기타</th><td class="fa-pre" th:text="${item.etc}"></td></tr>
</tbody>
</body>
</html>
