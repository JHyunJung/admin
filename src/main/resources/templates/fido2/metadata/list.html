<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO2 메타데이터</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">FIDO2 메타데이터</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/fido2/metadata/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/fido2/metadata}" class="fa-filter">
    <div><label class="form-label" for="f-aaguid">AAGUID</label><input id="f-aaguid" name="aaguid" th:value="${search.aaguid}" class="form-control"></div>
    <div><label class="form-label" for="f-description">설명</label><input id="f-description" name="description" th:value="${search.description}" class="form-control"></div>
    <div><label class="form-label" for="f-protocolfamily">프로토콜</label><input id="f-protocolfamily" name="protocolfamily" th:value="${search.protocolfamily}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/fido2/metadata}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle fa-table mb-0">
        <thead class="table-light">
          <tr><th class="text-end">IDX</th><th>설명</th><th>AAGUID</th><th>프로토콜</th><th class="text-end">버전</th><th>어서션</th><th>2FA 전용</th><th>등록일</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="text-end fa-mono" th:text="${r.idx}">0</td>
            <td><a th:href="@{/fido2/metadata/{id}(id=${r.idx})}" th:text="${r.description}">설명</a></td>
            <td class="fa-mono" th:text="${r.aaguid}"></td>
            <td th:text="${r.protocolfamily}"></td>
            <td class="text-end fa-mono" th:text="${r.authenticatorversion}"></td>
            <td th:text="${r.assertionschme}"></td>
            <td th:text="${r.issecondfactoronly}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.createdtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(8, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
