<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO2 크리덴셜 파라미터 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/fido2/credential-params}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|크리덴셜 파라미터 #${item.idx}|">크리덴셜 파라미터</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/fido2/credential-params/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/fido2/credential-params/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: infoRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="infoRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>타입</th><td th:text="${item.credType}"></td></tr>
  <tr><th>알고리즘(COSE)</th><td class="fa-mono" th:text="${item.credAlg}"></td></tr>
  <tr><th>상태</th><td th:text="${item.status}"></td></tr>
  <tr><th>등록일시</th><td class="fa-mono" th:text="${#temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
