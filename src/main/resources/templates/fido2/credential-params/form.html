<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '크리덴셜 파라미터 등록' : '크리덴셜 파라미터 수정'">크리덴셜 파라미터</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '크리덴셜 파라미터 등록' : '크리덴셜 파라미터 수정', null)}"></div>
  <form th:action="${isNew} ? @{/fido2/credential-params} : @{/fido2/credential-params/{id}(id=${id})}" th:object="${form}" method="post" class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="credType">타입<span class="fa-req">*</span></label>
          <input th:field="*{credType}" class="form-control" th:classappend="${#fields.hasErrors('credType')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{credType}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="credAlg">알고리즘(COSE)<span class="fa-req">*</span></label>
          <input type="number" th:field="*{credAlg}" class="form-control" placeholder="-7 (ES256), -257 (RS256)" th:classappend="${#fields.hasErrors('credAlg')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{credAlg}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="status">상태<span class="fa-req">*</span></label>
          <select th:field="*{status}" class="form-select"><option value="T">T (사용)</option><option value="F">F (미사용)</option></select>
        </div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/fido2/credential-params} : @{/fido2/credential-params/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
