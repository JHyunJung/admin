<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO2 크리덴셜 파라미터</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">FIDO2 크리덴셜 파라미터</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/fido2/credential-params/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/fido2/credential-params}" class="fa-filter">
    <div><label class="form-label" for="f-credType">타입</label><input id="f-credType" name="credType" th:value="${search.credType}" class="form-control"></div>
    <div>
      <label class="form-label" for="f-status">상태</label>
      <select id="f-status" name="status" class="form-select">
        <option value="">전체</option>
        <option value="T" th:selected="${search.status == 'T'}">T (사용)</option>
        <option value="F" th:selected="${search.status == 'F'}">F (미사용)</option>
      </select>
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/fido2/credential-params}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle fa-table mb-0">
        <thead class="table-light"><tr><th class="text-end">IDX</th><th>타입</th><th class="text-end">알고리즘(COSE)</th><th>상태</th><th>등록일</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="text-end fa-mono"><a th:href="@{/fido2/credential-params/{id}(id=${r.idx})}" th:text="${r.idx}">0</a></td>
            <td th:text="${r.credType}"></td>
            <td class="text-end fa-mono" th:text="${r.credAlg}"></td>
            <td><span class="badge" th:classappend="${r.status == 'T'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${r.status}"></span></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.createdtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(5, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
