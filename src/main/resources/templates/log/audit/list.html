<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>감사 로그</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header('감사 로그', null)}"></div>
  <form method="get" th:action="@{/logs/audit}" class="fa-filter">
    <div><label class="form-label" for="f-userId">사용자</label><input id="f-userId" name="userId" th:value="${search.userId}" class="form-control"></div>
    <div>
      <label class="form-label" for="f-type">유형</label>
      <select id="f-type" name="type" class="form-select">
        <option value="">전체</option>
        <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${search.type == t.name()}"></option>
      </select>
    </div>
    <div><label class="form-label" for="f-message">메시지</label><input id="f-message" name="message" th:value="${search.message}" class="form-control"></div>
    <div><label class="form-label" for="f-fromDate">시작일</label><input id="f-fromDate" type="date" name="fromDate" th:value="${search.fromDate}" class="form-control"></div>
    <div><label class="form-label" for="f-toDate">종료일</label><input id="f-toDate" type="date" name="toDate" th:value="${search.toDate}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/logs/audit}" class="btn btn-link">초기화</a>
    </div>
  </form>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle fa-table mb-0">
        <thead class="table-light"><tr><th>IDX</th><th>유형</th><th>사용자</th><th>메시지</th><th>IP</th><th>일시</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono"><a th:href="@{/logs/audit/{id}(id=${r.idx})}" th:text="${r.idx}">0</a></td>
            <td><span class="badge text-bg-secondary" th:text="${r.type}"></span></td>
            <td th:text="${r.userId}"></td>
            <td th:text="${#strings.abbreviate(r.message, 80)}"></td>
            <td class="fa-mono" th:text="${r.ip}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(6, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
