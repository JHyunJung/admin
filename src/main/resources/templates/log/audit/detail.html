<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>감사 로그 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/logs/audit}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|감사 로그 #${item.idx}|"></h1>
      </div>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('로그 정보', ~{this :: basicRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="basicRows">
  <tr><th>IDX</th><td th:text="${item.idx}"></td></tr>
  <tr><th>고객사</th><td th:text="|${item.companyName} (${item.companyIdx})|"></td></tr>
  <tr><th>유형</th><td th:text="${item.type}"></td></tr>
  <tr><th>사용자</th><td th:text="|${item.userName} (${item.userId})|"></td></tr>
  <tr><th>메시지</th><td class="fa-pre" th:text="${item.message}"></td></tr>
  <tr><th>IP</th><td class="fa-mono" th:text="${item.ip}"></td></tr>
  <tr><th>User-Agent</th><td class="fa-pre fa-mono" th:text="${item.ua}"></td></tr>
  <tr><th>무결성 해시</th><td class="fa-mono" th:text="${item.intergrityHash}"></td></tr>
  <tr><th>일시</th><td class="fa-mono" th:text="${#temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
