<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>예외 로그 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/logs/exceptions}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|예외 로그 #${item.idx}|"></h1>
        <span class="badge" th:classappend="${item.level == 'ERROR'} ? 'text-bg-danger' : 'text-bg-secondary'" th:text="${item.level}"></span>
      </div>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: basicRows})}"></div>
  <div th:replace="~{fragments/detail-section :: section('예외 내용', ~{this :: bodyRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="basicRows">
  <tr><th>IDX</th><td th:text="${item.idx}"></td></tr>
  <tr><th>고객사</th><td th:text="|${companyName} (${item.companyIdx})|"></td></tr>
  <tr><th>유형</th><td th:text="${item.type}"></td></tr>
  <tr><th>레벨</th><td th:text="${item.level}"></td></tr>
  <tr><th>일시</th><td class="fa-mono" th:text="${item.createdtime}"></td></tr>
</tbody>

<tbody th:fragment="bodyRows">
  <tr><th>메시지</th><td class="fa-pre" th:text="${item.message}"></td></tr>
  <tr><th>상세 메시지</th><td class="fa-pre" th:text="${item.detailMessage}"></td></tr>
  <tr><th>예외 데이터</th><td><pre class="fa-pre fa-mono mb-0" th:text="${item.data}"></pre></td></tr>
</tbody>
</body>
</html>
