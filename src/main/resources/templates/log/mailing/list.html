<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>메일/SMS 큐</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header('메일/SMS 큐', null)}"></div>
  <form method="get" th:action="@{/logs/mailing}" class="fa-filter">
    <div><label class="form-label" for="f-status">상태</label><input id="f-status" name="status" th:value="${search.status}" class="form-control"></div>
    <div><label class="form-label" for="f-to">수신자</label><input id="f-to" name="to" th:value="${search.to}" class="form-control"></div>
    <div><label class="form-label" for="f-smsStatus">SMS 상태</label><input id="f-smsStatus" name="smsStatus" th:value="${search.smsStatus}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/logs/mailing}" class="btn btn-link">초기화</a>
    </div>
  </form>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle fa-table mb-0">
        <thead class="table-light">
          <tr><th>IDX</th><th>수신자</th><th>제목</th><th>상태</th><th>SMS 수신자</th><th>SMS 상태</th><th>발송시각</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono"><a th:href="@{/logs/mailing/{id}(id=${r.idx})}" th:text="${r.idx}">0</a></td>
            <td th:text="${#strings.abbreviate(r.to, 40)}"></td>
            <td th:text="${#strings.abbreviate(r.subject, 40)}"></td>
            <td><span class="badge text-bg-secondary" th:text="${r.status}"></span></td>
            <td th:text="${#strings.abbreviate(r.smsTo, 40)}"></td>
            <td><span class="badge text-bg-secondary" th:text="${r.smsStatus}"></span></td>
            <td class="text-nowrap fa-mono" th:text="${r.sendtime}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(7, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
