<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '라이선스 등록' : '라이선스 수정'">라이선스</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '라이선스 등록' : '라이선스 수정', null)}"></div>
  <form th:action="${isNew} ? @{/licenses} : @{/licenses/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="serviceName">서비스명</label><input th:field="*{serviceName}" class="form-control"></div>
        <div class="col-md-4"><label class="form-label" for="contactName">담당자</label><input th:field="*{contactName}" class="form-control"></div>
        <div class="col-md-4"><label class="form-label" for="contactPhone">전화</label><input th:field="*{contactPhone}" class="form-control"></div>
        <div class="col-md-4"><label class="form-label" for="contactEmail">이메일</label><input th:field="*{contactEmail}" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="license">라이선스</label><textarea th:field="*{license}" rows="4" class="form-control fa-mono"></textarea></div>
        <div class="col-md-6"><label class="form-label" for="filePath">파일 경로</label><input th:field="*{filePath}" class="form-control"></div>
        <div class="col-md-6"><label class="form-label" for="hashvalue">해시</label><input th:field="*{hashvalue}" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="etc">비고</label><textarea th:field="*{etc}" rows="2" class="form-control"></textarea></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/licenses} : @{/licenses/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
