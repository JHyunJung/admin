<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>고객사</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">고객사</h1><p class="fa-page-desc">서비스를 사용하는 고객사와 계약·한도를 관리합니다.</p></div>
    <div class="fa-page-actions">
      <a th:href="@{/companies/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/companies}" class="fa-filter">
    <div>
      <label class="form-label" for="f-companyName">이름</label>
      <input id="f-companyName" name="companyName" th:value="${search.companyName}" class="form-control">
    </div>
    <div>
      <label class="form-label" for="f-companyType">유형</label>
      <input id="f-companyType" name="companyType" th:value="${search.companyType}" class="form-control">
    </div>
    <div>
      <label class="form-label" for="f-enableType">사용</label>
      <select id="f-enableType" name="enableType" class="form-select">
        <option value="">전체</option>
        <option value="Y" th:selected="${search.enableType == 'Y'}">Y</option>
        <option value="N" th:selected="${search.enableType == 'N'}">N</option>
      </select>
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/companies}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light">
          <tr><th>IDX</th><th>이름</th><th>유형</th><th>업체 코드</th><th>연락처</th><th>사용</th><th class="text-end">최대 사용자</th><th>등록일</th></tr>
        </thead>
        <tbody>
          <tr th:each="c : ${page.content}">
            <td class="fa-mono" th:text="${c.idx}">0</td>
            <td><a th:href="@{/companies/{id}(id=${c.idx})}" th:text="${c.companyName}">이름</a></td>
            <td th:text="${c.companyType}"></td>
            <td class="fa-mono" th:text="${c.vendorCode}"></td>
            <td th:text="${c.contact}"></td>
            <td><span class="badge" th:classappend="${c.enableType == 'Y'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${c.enableType}"></span></td>
            <td class="text-end fa-mono" th:text="${c.maxUser}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(c.createdtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(8, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
