<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>가입 승인</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">가입 승인</h1>
    <span class="text-secondary small" th:text="|대기 ${#lists.size(items)}건|">대기 0건</span>
  </div>

  <div class="bg-white border rounded p-4 text-center text-secondary" th:if="${#lists.isEmpty(items)}">
    승인 대기 중인 신청이 없습니다.
  </div>

  <!-- 신청 1건 = 카드 1장. 승인은 고객사 선택이, 거절은 사유 입력이 함께 있어야 해서 표로 만들지 않는다. -->
  <div class="fa-section" th:each="m : ${items}">
    <div class="bg-white border rounded p-3">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
          <span class="fw-semibold" th:text="${m.userNm}">이름</span>
          <span class="text-secondary small ms-2" th:text="${m.userId}">아이디</span>
          <span class="badge text-bg-warning ms-2" th:text="${m.status}">승인대기</span>
        </div>
        <span class="text-secondary small"
              th:text="${m.createdtime != null} ? ${#temporals.format(m.createdtime, 'yyyy-MM-dd HH:mm')} : ''">신청일시</span>
      </div>

      <div class="small text-secondary mb-1">
        <i class="bi bi-envelope me-1" aria-hidden="true"></i><span th:text="${m.userEmail}">이메일</span>
      </div>
      <div class="small text-secondary mb-1" th:if="${m.userPhone}">
        <i class="bi bi-telephone me-1" aria-hidden="true"></i><span th:text="${m.userPhone}">전화</span>
      </div>
      <div class="small fa-pre border-start ps-2 mb-3 mt-2" th:if="${m.etc}" th:text="${m.etc}">신청 사유</div>

      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <form th:action="@{/signups/{id}/approve(id=${m.idx})}" method="post"
                th:id="|approveForm${m.idx}|" class="row g-2 align-items-end m-0">
            <div class="col">
              <label class="form-label small mb-1" th:for="|companyIdx${m.idx}|">소속 고객사</label>
              <!-- 전역(IDX 0)은 컨트롤러가 목록에서 빼 준다. 승인으로 슈퍼 관리자를 만들 수 없다. -->
              <select th:id="|companyIdx${m.idx}|" name="companyIdx" class="form-select" required>
                <option value="">선택하세요</option>
                <option th:each="c : ${companies}" th:value="${c.idx}" th:text="${c.companyName}"></option>
              </select>
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-primary"
                      th:attr="data-confirm-form=|approveForm${m.idx}|"
                      th:data-confirm-message="|${m.userId} 의 가입을 승인하시겠습니까?|"
                      data-confirm-ok="승인">승인</button>
            </div>
          </form>
        </div>
        <div class="col-md-7">
          <form th:action="@{/signups/{id}/reject(id=${m.idx})}" method="post"
                th:id="|rejectForm${m.idx}|" class="row g-2 align-items-end m-0">
            <div class="col">
              <label class="form-label small mb-1" th:for="|reason${m.idx}|">거절 사유</label>
              <!-- 100자 제한. CCFA_MANAGER.ETC 는 2048"바이트"이고 신청 사유가 최대 1700바이트 +
                   접두사 15바이트를 이미 쓴다. 남는 약 318바이트는 한글 106자라 100자가 안전한 한도다.
                   SignupService.reject() 가 바이트 기준으로 잘라 주지만, 잘릴 양을 입력하게 두지 않는다. -->
              <input type="text" th:id="|reason${m.idx}|" name="reason" class="form-control" maxlength="100"
                     placeholder="거절 사유 (최대 100자)">
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-outline-danger"
                      th:attr="data-confirm-form=|rejectForm${m.idx}|"
                      th:data-confirm-message="|${m.userId} 의 가입을 거절하시겠습니까? 되돌릴 수 없습니다.|"
                      data-confirm-ok="거절">거절</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
