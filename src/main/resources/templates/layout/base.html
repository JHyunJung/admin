<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">FIDO Admin</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" sizes="192x192">
  <link rel="apple-touch-icon" th:href="@{/favicon.png}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="fa-shell">
  <nav class="fa-sidebar" th:replace="~{fragments/sidebar :: sidebar}"></nav>
  <div class="fa-main">
    <header class="fa-topbar">
      <!--/* 브레드크럼 "그룹 / 메뉴명". 메뉴에 없는 경로(고객사 선택·에러 등)는 그리지 않는다. */-->
      <nav class="fa-crumbs" aria-label="현재 위치" th:if="${@menuRegistry.isRegistered(currentPath)}">
        <span th:text="${@menuRegistry.groupFor(currentPath)}">그룹</span>
        <span aria-hidden="true">/</span>
        <span class="fa-crumb-current" th:text="${@menuRegistry.titleFor(currentPath)}">메뉴</span>
      </nav>
      <span th:unless="${@menuRegistry.isRegistered(currentPath)}"></span>
      <div class="fa-topbar-right">
        <!-- SUPER + 시스템 영역: 테넌트 맥락이 아님을 드러낸다 -->
        <span class="fa-sys-badge" sec:authorize="hasRole('SUPER')" th:if="${currentArea?.name() == 'SYSTEM'}">
          <i class="bi bi-gear" aria-hidden="true"></i> 시스템 관리
        </span>
        <!-- 본인 계정 메뉴. 항목은 MenuArea.PERSONAL 에서 읽는다. -->
        <div class="dropdown" id="account-menu"
             th:with="personalItems=${@menuRegistry.itemsFor(
                        #authorization.expression('hasRole(''SUPER'')'),
                        T(com.crosscert.fidoadmin.common.MenuArea).PERSONAL)},
                      nm=${#authentication.principal.userNm}">
          <button class="fa-account-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="fa-avatar" aria-hidden="true" th:text="${#strings.isEmpty(nm)} ? '?' : ${#strings.substring(nm, 0, 1)}">이</span>
            <span sec:authentication="principal.userNm">이름</span>
            <span class="fa-role-badge" sec:authorize="hasRole('SUPER')">SUPER</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-1 small text-secondary">
              <span sec:authentication="principal.companyName">고객사</span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li th:each="m : ${personalItems}">
              <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{${m.href}}"
                 th:classappend="${currentPath == m.href} ? 'active' : ''">
                <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
                <span th:text="${m.title}">메뉴</span>
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <!-- 로그아웃은 상태를 바꾸므로 POST 폼이다(CSRF 토큰이 함께 간다). -->
              <form th:action="@{/logout}" method="post" class="m-0">
                <button class="dropdown-item d-flex align-items-center gap-2" type="submit">
                  <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                  <span>로그아웃</span>
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div class="fa-content">
      <div th:replace="~{fragments/alert :: flash}"></div>
      <main th:replace="${content}"></main>
    </div>
  </div>
</div>
<div th:replace="~{fragments/confirm-modal :: modal}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
