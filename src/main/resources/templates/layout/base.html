<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">FIDO Admin</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" sizes="192x192">
  <link rel="apple-touch-icon" th:href="@{/favicon.png}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="fa-shell">
  <nav class="fa-sidebar" th:replace="~{fragments/sidebar :: sidebar}"></nav>
  <div class="fa-main">
    <header class="fa-topbar d-flex align-items-center justify-content-between px-3">
      <span class="fw-semibold">FIDO Admin</span>
      <div class="d-flex align-items-center gap-3 small">

        <!-- SUPER + 테넌트 영역: 고객사 전환 드롭다운 -->
        <div class="dropdown" id="tenant-switcher"
             th:if="${currentArea?.name() == 'TENANT' and !#lists.isEmpty(selectableCompanies)}">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-building" aria-hidden="true"></i>
            <span th:text="${selectedCompanyName} ?: '고객사 선택'">고객사</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li th:each="c : ${selectableCompanies}">
              <form method="post" th:action="@{/select-tenant}" class="m-0">
                <input type="hidden" name="companyIdx" th:value="${c.idx}">
                <input type="hidden" name="returnTo" th:value="${currentPath}">
                <button type="submit" class="dropdown-item" th:text="${c.companyName}">고객사</button>
              </form>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" th:href="@{/select-tenant}">
              <i class="bi bi-gear" aria-hidden="true"></i> 고객사 선택 화면으로</a></li>
          </ul>
        </div>

        <!-- SUPER + 시스템 영역: 테넌트 맥락이 아님을 드러낸다 -->
        <span class="badge text-bg-dark" sec:authorize="hasRole('SUPER')"
              th:if="${currentArea?.name() == 'SYSTEM'}">
          <i class="bi bi-gear" aria-hidden="true"></i> 시스템 관리
        </span>

        <!-- 본인 계정 메뉴. 업무 메뉴(사이드바)와 성격이 달라 여기 모은다.
             항목은 MenuArea.PERSONAL 에서 읽으므로 개인 화면이 늘면 여기 자동으로 들어온다. -->
        <div class="dropdown" id="account-menu"
             th:with="personalItems=${@menuRegistry.itemsFor(
                        #authorization.expression('hasRole(''SUPER'')'),
                        T(com.crosscert.fidoadmin.common.MenuArea).PERSONAL)}">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2"
                  type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle" aria-hidden="true"></i>
            <span sec:authentication="principal.userNm">이름</span>
            <span class="badge text-bg-secondary" sec:authorize="hasRole('SUPER')">SUPER</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-1 small text-secondary">
              <!-- 소속. SUPER 는 전역이라 고정 문구가 아니라 실제 소속명을 그대로 보여준다. -->
              <span sec:authentication="principal.companyName">고객사</span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li th:each="m : ${personalItems}">
              <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{${m.href}}"
                 th:classappend="${currentPath == m.href} ? 'active' : ''">
                <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
                <span th:text="${m.title}">메뉴</span>
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <!-- 로그아웃은 상태를 바꾸므로 링크가 아니라 POST 폼이다(CSRF 토큰이 함께 간다). -->
              <form th:action="@{/logout}" method="post" class="m-0">
                <button class="dropdown-item d-flex align-items-center gap-2" type="submit">
                  <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                  <span>로그아웃</span>
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div class="fa-content p-3">
      <div th:replace="~{fragments/alert :: flash}"></div>
      <main th:replace="${content}"></main>
    </div>
  </div>
</div>
<div th:replace="~{fragments/confirm-modal :: modal}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
