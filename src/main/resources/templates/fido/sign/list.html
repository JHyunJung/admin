<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>서명</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header('서명', null)}"></div>
  <form method="get" th:action="@{/signs}" class="fa-filter">
    <div><label class="form-label" for="f-userid">USERID</label><input id="f-userid" name="userid" th:value="${search.userid}" class="form-control"></div>
    <div>
      <label class="form-label" for="f-del">DEL</label>
      <select id="f-del" name="del" class="form-select">
        <option value="">전체</option>
        <option value="Y" th:selected="${search.del == 'Y'}">Y</option>
        <option value="N" th:selected="${search.del == 'N'}">N</option>
      </select>
    </div>
    <div><label class="form-label" for="f-fromDate">시작일</label><input id="f-fromDate" type="date" name="fromDate" th:value="${search.fromDate}" class="form-control"></div>
    <div><label class="form-label" for="f-toDate">종료일</label><input id="f-toDate" type="date" name="toDate" th:value="${search.toDate}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/signs}" class="btn btn-link">초기화</a>
    </div>
  </form>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th class="text-end">IDX</th><th>USERID</th><th>DN</th><th>ASSERTION</th><th>메모</th><th>DEL</th><th>생성일</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="text-end fa-mono"><a th:href="@{/signs/{id}(id=${r.idx})}" th:text="${r.idx}">0</a></td>
            <td class="fa-mono" th:text="${r.userid}"></td>
            <td th:text="${r.dn}"></td>
            <td class="fa-mono" th:text="${r.assertionHead}"></td>
            <td th:text="${r.memo}"></td>
            <td th:text="${r.del}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.createtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(7, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
