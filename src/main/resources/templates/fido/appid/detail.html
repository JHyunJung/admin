<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>앱 ID 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/appids}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|앱 ID #${item.idx}|">앱 ID</h1>
        <span class="badge"
              th:classappend="${item.status == 'use' ? 'text-bg-success' : (item.status == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
              th:text="${item.status == 'use' ? '활성' : (item.status == 'unuse' ? '비활성' : '미확인')}"></span>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/appids/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary"><i class="bi bi-pencil-square" aria-hidden="true"></i>수정</a>
      <form th:action="@{/appids/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm"><i class="bi bi-trash" aria-hidden="true"></i>삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('앱 ID 정보', ~{this :: infoRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="infoRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>고객사</th><td th:text="|${companyName} (${item.companyIdx})|"></td></tr>
  <tr><th>APPID</th><td class="fa-pre fa-mono" th:text="${item.appid}"></td></tr>
  <tr><th>설명</th><td class="fa-pre" th:text="${item.memo}"></td></tr>
  <tr><th>장치</th><td><span th:replace="~{fragments/device :: label(${item.device})}"></span></td></tr>
  <tr><th>서비스명</th><td th:text="${item.servicename}"></td></tr>
  <tr><th>기본값</th><td th:text="${item.deviceDefault == 'T' ? '설정' : (item.deviceDefault == 'F' ? '설정안함' : item.deviceDefault)}"></td></tr>
  <tr><th>상태</th><td><span class="badge" th:classappend="${item.status == 'use' ? 'text-bg-success' : (item.status == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}" th:text="${item.status == 'use' ? '활성' : (item.status == 'unuse' ? '비활성' : item.status)}"></span></td></tr>
  <tr><th>등록일시</th><td class="fa-mono" th:text="${#temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
  <tr><th>수정일시</th><td class="fa-mono" th:text="${#temporals.format(item.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
