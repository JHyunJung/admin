<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>AppID 관리</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">AppID 관리</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/appids/new}" class="btn btn-outline-secondary"><i class="bi bi-plus-lg" aria-hidden="true"></i>추가하기</a>
    </div>
  </div>

  <form method="get" th:action="@{/appids}" class="fa-filter">
    <div><label class="form-label" for="f-appid">APPID</label><input id="f-appid" name="appid" th:value="${search.appid}" class="form-control" placeholder="APPID" aria-label="APPID"></div>
    <div><label class="form-label" for="f-servicename">서비스명</label><input id="f-servicename" name="servicename" th:value="${search.servicename}" class="form-control" placeholder="서비스명" aria-label="서비스명"></div>
    <div>
      <label class="form-label" for="f-status">상태</label>
      <select id="f-status" name="status" class="form-select" aria-label="상태">
        <option value="">상태 전체</option>
        <option value="use" th:selected="${search.status == 'use'}">활성</option>
        <option value="unuse" th:selected="${search.status == 'unuse'}">비활성</option>
      </select>
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/appids}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle fa-table mb-0">
        <thead class="table-light">
          <tr><th class="text-end">번호</th><th>APPID</th><th>서비스명</th><th>장치</th><th>설명</th><th>기본값</th><th>상태</th><th>생성일</th><th>수정일</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="text-end fa-mono" th:text="${r.idx}">0</td>
            <td class="fa-mono" style="white-space: normal; overflow-wrap: anywhere;"><a th:href="@{/appids/{id}(id=${r.idx})}" th:text="${r.appid}">appid</a></td>
            <td th:text="${r.servicename}"></td>
            <td><span th:replace="~{fragments/device :: label(${r.device})}"></span></td>
            <td style="white-space: normal; overflow-wrap: anywhere;" th:text="${r.memo}"></td>
            <td th:text="${r.deviceDefault == 'T' ? '설정' : ''}"></td>
            <td>
              <span class="badge text-nowrap"
                    th:classappend="${r.status == 'use' ? 'text-bg-success' : (r.status == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
                    th:text="${r.status == 'use' ? '활성' : (r.status == 'unuse' ? '비활성' : '미확인')}"></span>
            </td>
            <td class="text-nowrap fa-mono" th:text="${r.createdtime == null ? '-' : #temporals.format(r.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td class="text-nowrap fa-mono" th:text="${r.updatedtime == null ? '-' : #temporals.format(r.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(9, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div th:replace="~{fragments/list-footer :: footer(${page}, ${basePath})}"></div>
  </div>
</main>
</body>
</html>
