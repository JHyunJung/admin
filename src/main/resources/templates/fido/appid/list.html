<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>AppID 관리</title></head>
<body>
<main class="fa-list-legacy">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">AppID 관리</h1>
    <a th:href="@{/appids/new}" class="btn btn-outline-secondary btn-sm bg-white"><i class="bi bi-plus-lg me-1"></i>추가하기</a>
  </div>

  <!--/* 검색 조건은 필드별 입력칸을 유지하고, 배치·버튼만 이전 어드민 규격(오른쪽 정렬, 노란 검색 버튼)에 맞췄다. */-->
  <form method="get" th:action="@{/appids}" class="fa-search-panel row g-2 align-items-center justify-content-end">
    <div class="col-auto"><input name="appid" th:value="${search.appid}" class="form-control" placeholder="APPID" aria-label="APPID"></div>
    <div class="col-auto"><input name="servicename" th:value="${search.servicename}" class="form-control" placeholder="서비스명" aria-label="서비스명"></div>
    <div class="col-auto">
      <select name="status" class="form-select" aria-label="상태">
        <option value="">상태 전체</option>
        <option value="use" th:selected="${search.status == 'use'}">활성</option>
        <option value="unuse" th:selected="${search.status == 'unuse'}">비활성</option>
      </select>
    </div>
    <div class="col-auto"><button class="btn btn-search"><i class="bi bi-search me-1"></i>검색</button></div>
    <div class="col-auto"><a th:href="@{/appids}" class="btn btn-link btn-sm">초기화</a></div>
  </form>

  <div class="table-responsive bg-white border rounded">
    <table class="table table-sm table-hover align-middle fa-table mb-0">
      <thead class="table-light">
        <tr><th>번호</th><th>APPID</th><th>서비스명</th><th>장치</th><th>설명</th><th>기본값</th><th>상태</th><th>생성일</th><th>수정일</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${page.content}">
          <td th:text="${r.idx}">0</td>
          <td style="white-space: normal; overflow-wrap: anywhere;"><a th:href="@{/appids/{id}(id=${r.idx})}" th:text="${r.appid}">appid</a></td>
          <td th:text="${r.servicename}"></td>
          <td th:text="${r.device == 'android' ? 'Android' : (r.device == 'ios' ? 'iOS' : r.device)}"></td>
          <td style="white-space: normal; overflow-wrap: anywhere;" th:text="${r.memo}"></td>
          <td th:text="${r.deviceDefault == 'T' ? '설정' : ''}"></td>
          <td>
            <span class="badge text-nowrap"
                  th:classappend="${r.status == 'use' ? 'text-bg-success' : (r.status == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
                  th:text="${r.status == 'use' ? '활성' : (r.status == 'unuse' ? '비활성' : '미확인')}"></span>
          </td>
          <td class="text-nowrap" th:text="${r.createdtime == null ? '-' : #temporals.format(r.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          <td class="text-nowrap" th:text="${r.updatedtime == null ? '-' : #temporals.format(r.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${page.totalElements == 0}"><td colspan="9" class="text-center text-secondary py-4">데이터가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
  <div th:replace="~{fragments/list-footer :: footer(${page}, ${basePath})}"></div>
</main>
</body>
</html>
