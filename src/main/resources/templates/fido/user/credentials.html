<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>사용자 기기</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/users}"><i class="bi bi-arrow-left" aria-hidden="true"></i>사용자 목록</a>
      <div class="fa-title-row">
        <h1 class="h4"><span th:text="${userid}">userid</span> 의 기기</h1>
      </div>
      <p class="fa-page-desc">
        서비스명 <code th:text="${servicename}">svc</code> 기준입니다.
        기기를 누르면 상세와 상태 변경으로 이동합니다.
      </p>
    </div>
  </div>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light">
          <tr><th>IDX</th><th>AAID</th><th>상태</th><th class="text-end">서명횟수</th><th>등록일시</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${rows}">
            <!-- back 을 실어 상세에서 이 기기 목록으로 돌아오게 한다(사용자 목록이 아니라). -->
            <td class="fa-mono"><a th:href="@{/users/{id}(id=${r.idx},back=${#strings.concat('/users/', userid, '/credentials?servicename=', servicename)})}"
                   th:text="${r.idx}">0</a><i class="bi bi-chevron-right fa-row-chevron" aria-hidden="true"></i></td>
            <td class="fa-mono" th:text="${r.aaid}"></td>
            <td><span class="badge" th:classappend="${r.status == 'O'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${r.status}"></span></td>
            <td class="text-end fa-mono" th:text="${r.signcounter}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.regtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${#lists.isEmpty(rows)}"><tr th:replace="~{fragments/empty-state :: row(5, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${#lists.size(rows)}대|"></span>
    </div>
  </div>
</main>
</body>
</html>
