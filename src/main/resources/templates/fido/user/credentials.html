<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>사용자 기기</title></head>
<body>
<main>
  <div class="d-flex align-items-center gap-2 mb-1">
    <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">&larr; 사용자 목록</a>
    <h1 class="h4 mb-0"><span th:text="${userid}">userid</span> 의 기기</h1>
  </div>
  <p class="text-secondary small mb-3">
    서비스명 <code th:text="${servicename}">svc</code> 기준입니다.
    기기를 누르면 상세와 상태 변경으로 이동합니다.
  </p>

  <div class="table-responsive bg-white border rounded">
    <table class="table table-sm table-hover fa-table mb-0">
      <thead class="table-light">
        <tr><th>IDX</th><th>AAID</th><th>상태</th><th class="text-end">서명횟수</th><th>등록일시</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${rows}">
          <td><a th:href="@{/users/{id}(id=${r.idx})}" th:text="${r.idx}">0</a></td>
          <td class="fa-mono" th:text="${r.aaid}"></td>
          <td><span class="badge" th:classappend="${r.status == 'O'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${r.status}"></span></td>
          <td class="text-end" th:text="${r.signcounter}"></td>
          <td th:text="${#temporals.format(r.regtime, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="text-center text-secondary py-4">데이터가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="mt-2 small text-secondary" th:text="|총 ${#lists.size(rows)}대|"></div>
</main>
</body>
</html>
