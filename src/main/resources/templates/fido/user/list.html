<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>사용자</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header('사용자', '등록된 기기를 사용자 단위로 묶어 보여줍니다. 사용자를 누르면 그 사람의 기기 목록으로 이동합니다.')}"></div>
  <form method="get" th:action="@{/users}" class="fa-filter">
    <div><label class="form-label" for="f-userid">USERID</label><input id="f-userid" name="userid" th:value="${search.userid}" class="form-control"></div>
    <div><label class="form-label" for="f-servicename">서비스명</label><input id="f-servicename" name="servicename" th:value="${search.servicename}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/users}" class="btn btn-link">초기화</a>
    </div>
  </form>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light">
          <tr><th>USERID</th><th>서비스명</th><th class="text-end">기기 수</th><th class="text-end">정상</th><th>최근 등록</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono">
              <a th:href="@{/users/{u}/credentials(u=${r.userid}, servicename=${r.servicename})}"
                 th:text="${r.userid}">userid</a>
            </td>
            <td th:text="${r.servicename}"></td>
            <td class="text-end fa-mono" th:text="${r.deviceCount}">0</td>
            <!-- 정상 기기가 하나도 없으면 그 사용자는 인증할 수 없다. 눈에 띄게 표시한다. -->
            <td class="text-end">
              <span class="badge"
                    th:classappend="${r.activeCount > 0} ? 'text-bg-success' : 'text-bg-secondary'"
                    th:text="${r.activeCount}">0</span>
            </td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.lastRegtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(5, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}명|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
