<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>챌린지 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/challenges}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|챌린지 #${item.idx}|"></h1>
      </div>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('챌린지 정보', ~{this :: infoRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="infoRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>고객사</th><td th:text="|${companyName} (${item.companyIdx})|"></td></tr>
  <tr><th>USERID</th><td class="fa-mono" th:text="${item.userid}"></td></tr>
  <tr><th>서비스명</th><td th:text="${item.servicename}"></td></tr>
  <tr><th>챌린지코드</th><td class="fa-mono" th:text="${item.challengecode}"></td></tr>
  <tr><th>LOGIDX</th><td class="fa-mono" th:text="${item.logidx}"></td></tr>
  <tr><th>UV</th><td class="fa-mono" th:text="${item.uv}"></td></tr>
  <tr><th>생성일시</th><td class="fa-mono" th:text="${#temporals.format(item.createtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
