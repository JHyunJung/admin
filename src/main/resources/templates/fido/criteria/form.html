<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>AAID(정책) 등록</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header('AAID(정책) 등록', null)}"></div>
  <form th:action="@{/criteria}" th:object="${form}" method="post" class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-12">
          <p class="text-secondary small mb-2">
            FIDO UAF 메타데이터 문(JSON)을 붙여 넣으세요. AAID·인증 방식 등은 JSON 에서 읽어 채웁니다.
            등록한 AAID 는 모든 고객사에서 <strong>비활성</strong>으로 시작합니다.
          </p>
          <label class="form-label" for="jsondata">메타데이터 JSON<span class="fa-req">*</span></label>
          <textarea th:field="*{jsondata}" id="jsondata" rows="16" class="form-control fa-mono"
                    th:classappend="${#fields.hasErrors('jsondata')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:errors="*{jsondata}"></div>
        </div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="@{/criteria}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">등록</button>
    </div>
  </form>
</main>
</body>
</html>
