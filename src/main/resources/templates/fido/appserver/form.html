<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '멤버코드 등록' : '멤버코드 수정'">멤버코드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '멤버코드 등록' : '멤버코드 수정', null)}"></div>
  <form th:action="${isNew} ? @{/appservers} : @{/appservers/{id}(id=${id})}" th:object="${form}" method="post" class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="memberCodeView">멤버코드</label>
          <input th:if="${isNew}" id="memberCodeView" type="text" class="form-control" value="저장 시 자동 생성됩니다" disabled>
          <input th:unless="${isNew}" id="memberCodeView" type="text" class="form-control fa-mono" th:value="*{memberCode}" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="memberId">멤버키<span class="fa-req">*</span></label>
          <input th:field="*{memberId}" class="form-control" th:classappend="${#fields.hasErrors('memberId')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{memberId}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="type">상태<span class="fa-req">*</span></label>
          <select th:field="*{type}" class="form-select">
            <option value="use">활성</option>
            <option value="unuse">비활성</option>
          </select>
        </div>
        <div class="col-12"><label class="form-label" for="note">설명</label><input th:field="*{note}" class="form-control"></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/appservers} : @{/appservers/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
