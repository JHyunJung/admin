<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>멤버코드 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/appservers}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|멤버코드 #${item.idx}|"></h1>
        <span class="badge"
              th:classappend="${item.type == 'use' ? 'text-bg-success' : (item.type == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
              th:text="${item.type == 'use' ? '활성' : (item.type == 'unuse' ? '비활성' : '미확인')}"></span>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/appservers/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/appservers/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('멤버코드 정보', ~{this :: infoRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="infoRows">
  <tr><th>번호</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>고객사</th><td th:text="|${companyName} (${item.companyIdx})|"></td></tr>
  <tr><th>멤버코드</th><td class="fa-mono" th:text="${item.memberCode}"></td></tr>
  <tr><th>멤버키</th><td class="fa-mono" th:text="${item.memberId}"></td></tr>
  <tr><th>설명</th><td class="fa-pre" th:text="${item.note}"></td></tr>
  <tr>
    <th>상태</th>
    <td>
      <span class="badge"
            th:classappend="${item.type == 'use' ? 'text-bg-success' : (item.type == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
            th:text="${item.type == 'use' ? '활성' : (item.type == 'unuse' ? '비활성' : '미확인')}"></span>
    </td>
  </tr>
  <tr><th>생성일</th><td class="fa-mono" th:text="${item.createdtime == null ? '-' : #temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
  <tr><th>수정일</th><td class="fa-mono" th:text="${item.updatedtime == null ? '-' : #temporals.format(item.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
