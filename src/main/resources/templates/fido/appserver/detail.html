<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>멤버코드 상세</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0" th:text="|멤버코드 #${item.idx}|"></h1>
    <div class="d-flex gap-2">
      <a th:href="@{/appservers/{id}/edit(id=${item.idx})}" class="btn btn-outline-primary btn-sm">수정</a>
      <form th:action="@{/appservers/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger btn-sm" data-confirm-form="deleteForm">삭제</button>
      </form>
      <a th:href="@{/appservers}" class="btn btn-link btn-sm">목록</a>
    </div>
  </div>
  <div class="bg-white border rounded">
    <table class="table table-sm fa-detail mb-0">
      <tbody>
        <tr>
          <th>번호</th>
          <td th:text="${item.idx}"></td>
        </tr>
        <tr>
          <th>고객사</th>
          <td th:text="|${companyName} (${item.companyIdx})|"></td>
        </tr>
        <tr>
          <th>멤버코드</th>
          <td th:text="${item.memberCode}"></td>
        </tr>
        <tr>
          <th>멤버키</th>
          <td th:text="${item.memberId}"></td>
        </tr>
        <tr>
          <th>설명</th>
          <td class="fa-pre" th:text="${item.note}"></td>
        </tr>
        <tr>
          <th>상태</th>
          <td>
            <span class="badge"
                  th:classappend="${item.type == 'use' ? 'text-bg-success' : (item.type == 'unuse' ? 'text-bg-danger' : 'text-bg-secondary')}"
                  th:text="${item.type == 'use' ? '활성' : (item.type == 'unuse' ? '비활성' : '미확인')}"></span>
          </td>
        </tr>
        <tr>
          <th>생성일</th>
          <td th:text="${item.createdtime == null ? '-' : #temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        <tr>
          <th>수정일</th>
          <td th:text="${item.updatedtime == null ? '-' : #temporals.format(item.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
