<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>운영자</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">운영자</h1><p class="fa-page-desc">선택한 고객사의 운영자 계정을 관리합니다.</p></div>
    <div class="fa-page-actions">
      <a th:href="@{/managers/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/managers}" class="fa-filter">
    <div><label class="form-label" for="f-userId">ID</label><input id="f-userId" name="userId" th:value="${search.userId}" class="form-control"></div>
    <div><label class="form-label" for="f-userNm">이름</label><input id="f-userNm" name="userNm" th:value="${search.userNm}" class="form-control"></div>
    <div>
      <label class="form-label" for="f-status">상태</label>
      <select id="f-status" name="status" class="form-select">
        <option value="">전체</option>
        <option value="활성" th:selected="${search.status == '활성'}">활성</option>
        <option value="비활성" th:selected="${search.status == '비활성'}">비활성</option>
      </select>
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/managers}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light">
          <tr><th>IDX</th><th>ID</th><th>이름</th><th>이메일</th><th>상태</th><th>로그인</th><th>최근 접속</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono" th:text="${r.idx}">0</td>
            <td class="fa-mono"><a th:href="@{/managers/{id}(id=${r.idx})}" th:text="${r.userId}">id</a></td>
            <td th:text="${r.userNm}"></td>
            <td th:text="${r.userEmail}"></td>
            <td><span class="badge" th:classappend="${r.status == '활성'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${r.status}"></span></td>
            <td th:text="${r.login}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.lastAccess, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(7, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
