<!--/*
  목록 표 카드 하단 바 — "N건이 검색되었습니다." 배지와 « 1 » 페이지네이션.
  사용: th:replace="~{fragments/list-footer :: footer(${page}, ${basePath})}"
*/-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="footer(page, baseUrl)" class="fa-table-foot">
  <span class="fa-result-badge" th:text="|${page.totalElements}건이 검색되었습니다.|">0건이 검색되었습니다.</span>
  <div>
    <div th:replace="~{fragments/pagination :: pagination(${page}, ${baseUrl})}"></div>
    <!--/* 한 페이지뿐이어도 « 1 » 을 보여 준다(pagination 조각은 2쪽 이상일 때만 그린다). */-->
    <nav th:if="${page.totalPages <= 1}" aria-label="페이지 이동">
      <ul class="pagination">
        <li class="page-item disabled"><span class="page-link" aria-hidden="true"><i class="bi bi-chevron-left"></i></span></li>
        <li class="page-item active"><span class="page-link" aria-current="page">1</span></li>
        <li class="page-item disabled"><span class="page-link" aria-hidden="true"><i class="bi bi-chevron-right"></i></span></li>
      </ul>
    </nav>
  </div>
</div>
