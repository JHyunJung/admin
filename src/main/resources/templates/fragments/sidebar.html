<nav xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
     class="fa-sidebar" th:fragment="sidebar" aria-label="주 메뉴"
     th:with="isSuper=${#authorization.expression('hasRole(''SUPER'')')},
              tenantItems=${@menuRegistry.itemsFor(isSuper, T(com.crosscert.fidoadmin.common.MenuArea).TENANT)},
              systemItems=${@menuRegistry.itemsFor(isSuper, T(com.crosscert.fidoadmin.common.MenuArea).SYSTEM)},
              hasTenant=${selectedCompanyName != null}">
  <div class="fa-brand">
    <img th:src="@{/img/crosscert-logo.png}" alt="CROSSCERT" width="83" height="18">
    <span>FIDO Admin</span>
  </div>

  <!--/* 고객사 전환기. 아래 업무 메뉴가 전부 이 선택에 걸려 있다. 누르면 고객사 선택 화면으로 간다
         (V2: 상단바 드롭다운을 없애고 전환 수단을 이 하나로 모았다). */-->
  <a th:href="@{/select-tenant}" class="fa-tenant" th:classappend="${hasTenant} ? '' : 'fa-tenant-none'"
     th:title="${hasTenant} ? |선택된 고객사: ${selectedCompanyName} (눌러서 전환)| : '고객사를 선택해야 업무 메뉴가 열립니다'">
    <span class="fa-tenant-avatar" aria-hidden="true"
          th:text="${hasTenant and !#strings.isEmpty(selectedCompanyName)} ? ${#strings.substring(selectedCompanyName, 0, 1)} : '!'">고</span>
    <span class="fa-tenant-text">
      <span class="fa-tenant-label" th:text="${hasTenant} ? '선택된 고객사' : '고객사 미선택'">선택된 고객사</span>
      <span class="fa-tenant-name text-truncate" th:text="${hasTenant} ? ${selectedCompanyName} : '선택하기'">고객사</span>
    </span>
    <i class="bi bi-chevron-expand" aria-hidden="true"></i>
  </a>

  <th:block th:each="g : ${T(com.crosscert.fidoadmin.common.MenuRegistry).groups(tenantItems)}">
    <div class="fa-group" th:classappend="${hasTenant} ? '' : 'fa-nav-disabled'" th:text="${g.key}">그룹</div>
    <a th:each="m : ${g.value}" th:href="${hasTenant} ? @{${m.href}} : 'javascript:void(0)'"
       th:classappend="${(currentPath == m.href ? 'active ' : '') + (hasTenant ? '' : 'fa-nav-disabled')}"
       th:attr="tabindex=${hasTenant} ? null : '-1', aria-disabled=${hasTenant} ? null : 'true', aria-current=${currentPath == m.href} ? 'page' : null"
       class="fa-link">
      <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
      <span th:text="${m.title}">메뉴</span>
    </a>
  </th:block>

  <th:block th:if="${isSuper}">
    <div class="fa-nav-divider">시스템 · SUPER 전용</div>
    <th:block th:each="g : ${T(com.crosscert.fidoadmin.common.MenuRegistry).groups(systemItems)}">
      <div class="fa-group" th:text="${g.key}">그룹</div>
      <a th:each="m : ${g.value}" th:href="@{${m.href}}" class="fa-link"
         th:classappend="${currentPath == m.href} ? 'active' : ''"
         th:attr="aria-current=${currentPath == m.href} ? 'page' : null">
        <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
        <span th:text="${m.title}">메뉴</span>
      </a>
    </th:block>
  </th:block>

  <!--/* 개인 영역(MenuArea.PERSONAL)은 상단바 계정 메뉴에 있다(layout/base.html). */-->
  <div class="fa-powered">
    <span>Powered by</span>
    <img th:src="@{/img/crosscert-logo.png}" alt="CROSSCERT" width="60" height="13">
  </div>
</nav>
