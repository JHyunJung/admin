<nav xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
     class="fa-sidebar" th:fragment="sidebar"
     th:with="isSuper=${#authorization.expression('hasRole(''SUPER'')')},
              tenantItems=${@menuRegistry.itemsFor(isSuper, T(com.crosscert.fidoadmin.common.MenuArea).TENANT)},
              systemItems=${@menuRegistry.itemsFor(isSuper, T(com.crosscert.fidoadmin.common.MenuArea).SYSTEM)},
              hasTenant=${selectedCompanyName != null}">
  <div class="fa-brand px-3 py-3">FIDO Admin</div>

  <!--/* 지금 어느 고객사를 보고 있는지. 아래 업무 메뉴가 전부 이 선택에 걸려 있어서
         그룹 라벨과 섞이지 않게 별도 배너로 둔다. 눌러서 바로 전환할 수 있다. */-->
  <a th:href="@{/select-tenant}" class="fa-tenant" th:classappend="${hasTenant} ? '' : 'fa-tenant-none'"
     th:title="${hasTenant} ? |선택된 고객사: ${selectedCompanyName} (눌러서 전환)| : '고객사를 선택해야 업무 메뉴가 열립니다'">
    <span class="fa-tenant-label">
      <i class="bi" th:classappend="${hasTenant} ? 'bi-building' : 'bi-exclamation-triangle'" aria-hidden="true"></i>
      <span th:text="${hasTenant} ? '선택된 고객사' : '고객사 미선택'">선택된 고객사</span>
    </span>
    <span class="fa-tenant-name text-truncate"
          th:text="${hasTenant} ? ${selectedCompanyName} : '선택하기'">고객사</span>
  </a>
  <div th:each="g : ${T(com.crosscert.fidoadmin.common.MenuRegistry).groups(tenantItems)}" class="mb-2"
       th:classappend="${hasTenant} ? '' : 'opacity-50'">
    <div class="fa-group px-3 text-uppercase small text-secondary" th:text="${g.key}">그룹</div>
    <a th:each="m : ${g.value}" th:href="${hasTenant} ? @{${m.href}} : 'javascript:void(0)'"
       th:classappend="${currentPath == m.href} ? 'active' : ''"
       th:attr="tabindex=${hasTenant} ? null : '-1', aria-disabled=${hasTenant} ? null : 'true'"
       class="fa-link d-flex align-items-center gap-2 px-3 py-1">
      <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
      <span th:text="${m.title}">메뉴</span>
    </a>
  </div>

  <!-- 시스템 영역: 선택과 무관한 전역 화면 -->
  <div th:if="${isSuper}">
    <hr class="my-2 mx-3">
    <div th:each="g : ${T(com.crosscert.fidoadmin.common.MenuRegistry).groups(systemItems)}" class="mb-2">
      <div class="fa-group px-3 text-uppercase small text-secondary" th:text="${g.key}">그룹</div>
      <a th:each="m : ${g.value}" th:href="@{${m.href}}"
         th:classappend="${currentPath == m.href} ? 'active' : ''"
         class="fa-link d-flex align-items-center gap-2 px-3 py-1">
        <i class="bi" th:classappend="${m.icon}" aria-hidden="true"></i>
        <span th:text="${m.title}">메뉴</span>
      </a>
    </div>
  </div>

  <!--/* 개인 영역(MenuArea.PERSONAL)은 여기서 그리지 않는다. 본인 계정 관련 메뉴라
         업무 메뉴와 성격이 달라 헤더 우측의 사용자 드롭다운으로 옮겼다(layout/base.html).
         MenuRegistry 의 항목 자체는 남아 있다 — 그 영역 값이 테넌트 선택 인터셉터의
         판정 근거이기도 하다(개인 화면은 고객사 선택 없이 열려야 한다). */-->
</nav>
