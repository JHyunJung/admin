<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 빈 상태. 표 안에서는 row(colspan, message) 를 th:block th:if 로 감싸 쓴다
       (th:replace 가 th:if 보다 먼저 처리되므로 같은 태그에 두면 조건이 무시된다):
  <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(9, '데이터가 없습니다.')}"></tr></th:block>
  행에는 링크가 없다 — admin.js 행 클릭이 이 행을 건너뛴다. 그림은 장식이라 alt 를 비운다(문구가 내용이다). */-->
<tr th:fragment="row(colspan, message)">
  <td th:attr="colspan=${colspan}" class="fa-empty-cell">
    <div class="fa-empty">
      <img th:src="@{/img/ill/empty.webp}" alt="" width="160" height="120">
      <p th:text="${message}">데이터가 없습니다.</p>
    </div>
  </td>
</tr>
<div th:fragment="block(message, img)" class="fa-empty fa-card">
  <img th:src="@{|/img/ill/${img}.webp|}" alt="" width="160" height="120">
  <p th:text="${message}">데이터가 없습니다.</p>
</div>
</body>
</html>
