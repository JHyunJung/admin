<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>어드민 기준</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">어드민 기준</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/system/criteria/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/system/criteria}" class="fa-filter">
    <div>
      <label class="form-label" for="f-aaid">AAID</label>
      <input id="f-aaid" name="aaid" th:value="${search.aaid}" class="form-control">
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/criteria}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th>IDX</th><th>AAID</th><th>메타 해시</th><th>수정일시</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono" th:text="${r.idx}">0</td>
            <td class="fa-mono"><a th:href="@{/system/criteria/{id}(id=${r.idx})}" th:text="${r.aaid}">AAID</a></td>
            <td class="fa-mono" th:text="${#strings.abbreviate(r.metahash, 40)}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(4, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
