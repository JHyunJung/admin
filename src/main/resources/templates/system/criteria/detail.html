<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>어드민 기준 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/system/criteria}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|어드민 기준 #${item.idx}|">어드민 기준</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/system/criteria/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/system/criteria/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: basicRows})}"></div>
</main>

<tbody th:fragment="basicRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>AAID</th><td class="fa-mono" th:text="${item.aaid}"></td></tr>
  <tr><th>메타 해시</th><td class="fa-mono" th:text="${item.metahash}"></td></tr>
  <tr><th>JSONDATA</th><td><pre class="fa-pre fa-mono mb-0" th:text="${item.jsondataPretty}"></pre></td></tr>
  <tr><th>등록일시</th><td class="fa-mono" th:text="${#temporals.format(item.createtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
  <tr><th>수정일시</th><td class="fa-mono" th:text="${#temporals.format(item.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
