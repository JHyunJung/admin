<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '어드민 기준 등록' : '어드민 기준 수정'">어드민 기준</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '어드민 기준 등록' : '어드민 기준 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/criteria} : @{/system/criteria/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="aaid">AAID <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <input th:field="*{aaid}" class="form-control" th:classappend="${#fields.hasErrors('aaid')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{aaid}"></div>
        </div>
        <div class="col-md-6"><label class="form-label" for="metahash">메타 해시</label><input th:field="*{metahash}" class="form-control"></div>
        <div class="col-12">
          <label class="form-label" for="jsondata">JSONDATA</label>
          <textarea th:field="*{jsondata}" rows="12" class="form-control fa-mono" th:classappend="${#fields.hasErrors('jsondata')} ? 'is-invalid'"></textarea>
          <div class="invalid-feedback" th:errors="*{jsondata}"></div>
        </div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/criteria} : @{/system/criteria/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
