<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>필드 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/system/fields}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|필드 #${item.idx}|">필드</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/system/fields/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/system/fields/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('필드 정보', ~{this :: basicRows})}"></div>
</main>

<tbody th:fragment="basicRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>테이블</th><td class="fa-mono" th:text="${item.fieldTable}"></td></tr>
  <tr><th>필드 이름</th><td class="fa-mono" th:text="${item.fieldName}"></td></tr>
  <tr><th>유형</th><td th:text="${item.fieldType}"></td></tr>
  <tr><th>제목</th><td th:text="${item.fieldTitle}"></td></tr>
  <tr><th>PK</th><td th:text="${item.pk}"></td></tr>
  <tr><th>FK</th><td th:text="${item.fk}"></td></tr>
  <tr><th>편집 가능</th><td th:text="${item.editable}"></td></tr>
  <tr><th>코드 그룹</th><td th:text="${item.optionIdx == null} ? '' : |${optionNames.get(item.optionIdx) ?: ''} (${item.optionIdx})|"></td></tr>
</tbody>
</body>
</html>
