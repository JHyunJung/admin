<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '필드 등록' : '필드 수정'">필드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '필드 등록' : '필드 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/fields} : @{/system/fields/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="fieldTable">테이블 <span class="fa-req">*</span></label>
          <input th:field="*{fieldTable}" class="form-control" th:classappend="${#fields.hasErrors('fieldTable')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{fieldTable}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="fieldName">필드 이름 <span class="fa-req">*</span></label>
          <input th:field="*{fieldName}" class="form-control" th:classappend="${#fields.hasErrors('fieldName')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{fieldName}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="fieldType">유형 <span class="fa-req">*</span></label>
          <input th:field="*{fieldType}" class="form-control" th:classappend="${#fields.hasErrors('fieldType')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{fieldType}"></div>
        </div>
        <div class="col-md-6"><label class="form-label" for="fieldTitle">제목</label><input th:field="*{fieldTitle}" class="form-control"></div>
        <div class="col-md-6">
          <label class="form-label" for="optionIdx">코드 그룹</label>
          <select th:field="*{optionIdx}" class="form-select">
            <option value="">없음</option>
            <option th:each="o : ${options}" th:value="${o.idx}" th:text="|#${o.idx} ${o.optionName}|"></option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label" for="pk">PK(0/1)</label><input type="number" min="0" th:field="*{pk}" class="form-control"><div class="invalid-feedback d-block" th:errors="*{pk}"></div></div>
        <div class="col-md-4"><label class="form-label" for="fk">FK(0/1)</label><input type="number" min="0" th:field="*{fk}" class="form-control"><div class="invalid-feedback d-block" th:errors="*{fk}"></div></div>
        <div class="col-md-4"><label class="form-label" for="editable">편집 가능(0/1)</label><input type="number" min="0" th:field="*{editable}" class="form-control"><div class="invalid-feedback d-block" th:errors="*{editable}"></div></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/fields} : @{/system/fields/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
