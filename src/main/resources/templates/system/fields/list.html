<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>필드 정의</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">필드 정의</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/system/fields/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/system/fields}" class="fa-filter">
    <div><label class="form-label" for="f-fieldTable">테이블</label><input id="f-fieldTable" name="fieldTable" th:value="${search.fieldTable}" class="form-control"></div>
    <div><label class="form-label" for="f-fieldName">필드 이름</label><input id="f-fieldName" name="fieldName" th:value="${search.fieldName}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/fields}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th>IDX</th><th>테이블</th><th>필드 이름</th><th>유형</th><th>제목</th><th>PK</th><th>FK</th><th>편집</th><th>코드 그룹</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono text-end" th:text="${r.idx}">0</td>
            <td class="fa-mono" th:text="${r.fieldTable}"></td>
            <td class="fa-mono"><a th:href="@{/system/fields/{id}(id=${r.idx})}" th:text="${r.fieldName}">이름</a></td>
            <td th:text="${r.fieldType}"></td>
            <td th:text="${r.fieldTitle}"></td>
            <td class="text-end" th:text="${r.pk}"></td>
            <td class="text-end" th:text="${r.fk}"></td>
            <td class="text-end" th:text="${r.editable}"></td>
            <td th:text="${r.optionIdx == null} ? '' : (${optionNames.get(r.optionIdx)} ?: ${r.optionIdx})"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(9, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
