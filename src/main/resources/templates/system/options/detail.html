<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>코드 그룹 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/system/options}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|코드 그룹 #${item.idx} ${item.optionName}|">코드 그룹</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/system/options/{id}/edit(id=${item.idx})}" class="btn btn-outline-secondary"><i class="bi bi-pencil-square" aria-hidden="true"></i>수정</a>
      <form th:action="@{/system/options/{id}/delete(id=${item.idx})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm"
                data-confirm-message="그룹을 삭제하시겠습니까? 하위 코드가 있으면 삭제되지 않습니다."><i class="bi bi-trash" aria-hidden="true"></i>삭제</button>
      </form>
    </div>
  </div>

  <div th:replace="~{fragments/detail-section :: section('그룹 정보', ~{this :: basicRows})}"></div>

  <div class="fa-table-card">
    <h2 class="fa-section-title">코드 목록</h2>
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th class="text-end">IDX</th><th>값</th><th>제목</th><th>비고</th><th><span class="visually-hidden">작업</span></th></tr></thead>
        <tbody>
          <tr th:each="it : ${items}">
            <td class="text-end fa-mono" th:text="${it.idx}"></td>
            <td class="fa-mono" th:text="${it.optionValue}"></td>
            <td th:text="${it.optionTitle}"></td>
            <td th:text="${it.optionNote}"></td>
            <td class="text-end">
              <!-- 행마다 고유한 form id 를 주고 버튼이 그 id 를 가리킨다. admin.js 는 어떤 id 든 찾아 제출한다. -->
              <form th:action="@{/system/options/{id}/items/{itemIdx}/delete(id=${item.idx}, itemIdx=${it.idx})}" method="post"
                    th:id="|delItem${it.idx}|" class="m-0 d-inline">
                <button type="button" class="btn btn-outline-danger btn-sm" th:attr="data-confirm-form=|delItem${it.idx}|"
                        data-confirm-message="코드를 삭제하시겠습니까?">삭제</button>
              </form>
            </td>
          </tr>
          <th:block th:if="${#lists.isEmpty(items)}"><tr th:replace="~{fragments/empty-state :: row(5, '코드가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </div>

  <section class="fa-section" style="max-width: 760px">
    <h2 class="fa-section-title">코드 추가</h2>
    <form th:action="@{/system/options/{id}/items(id=${item.idx})}" th:object="${itemForm}" method="post"
          class="d-flex flex-wrap gap-3 align-items-end p-3 px-4">
      <div>
        <label class="form-label" for="optionValue">값 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
        <input th:field="*{optionValue}" class="form-control">
      </div>
      <div><label class="form-label" for="optionTitle">제목</label><input th:field="*{optionTitle}" class="form-control"></div>
      <div><label class="form-label" for="optionNote">비고</label><input th:field="*{optionNote}" class="form-control"></div>
      <div><button class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>코드 추가</button></div>
    </form>
  </section>
</main>

<tbody th:fragment="basicRows">
  <tr><th>IDX</th><td class="fa-mono" th:text="${item.idx}"></td></tr>
  <tr><th>그룹 이름</th><td th:text="${item.optionName}"></td></tr>
  <tr><th>제목</th><td th:text="${item.optionTitle}"></td></tr>
  <tr><th>비고</th><td th:text="${item.optionNote}"></td></tr>
</tbody>
</body>
</html>
