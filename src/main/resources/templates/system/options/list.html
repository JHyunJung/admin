<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>코드 그룹/코드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">코드 그룹/코드</h1><p class="fa-page-desc">코드 그룹을 만들고 그룹마다 코드 값을 관리합니다.</p></div>
    <div class="fa-page-actions">
      <a th:href="@{/system/options/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>그룹 등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/system/options}" class="fa-filter">
    <div>
      <label class="form-label" for="f-optionName">그룹 이름</label>
      <input id="f-optionName" name="optionName" th:value="${search.optionName}" class="form-control">
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/options}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th class="text-end">IDX</th><th>그룹 이름</th><th>제목</th><th>비고</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="text-end fa-mono" th:text="${r.idx}">0</td>
            <td class="fa-mono"><a th:href="@{/system/options/{id}(id=${r.idx})}" th:text="${r.optionName}">이름</a></td>
            <td th:text="${r.optionTitle}"></td>
            <td th:text="${r.optionNote}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(4, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
