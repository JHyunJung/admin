<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? 'FIDO 서버 등록' : 'FIDO 서버 수정'">FIDO 서버</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? 'FIDO 서버 등록' : 'FIDO 서버 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/fido-clients} : @{/system/fido-clients/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="servercode">코드 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <input th:field="*{servercode}" class="form-control" th:readonly="${!isNew}"
                 th:classappend="${#fields.hasErrors('servercode')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{servercode}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="status">상태 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <select th:field="*{status}" class="form-select"><option value="ON">ON</option><option value="OFF">OFF</option></select>
        </div>
        <div class="col-12">
          <label class="form-label" for="servername">이름 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <input th:field="*{servername}" class="form-control" th:classappend="${#fields.hasErrors('servername')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{servername}"></div>
        </div>
        <div class="col-12">
          <label class="form-label" for="serverurl">URL <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <input th:field="*{serverurl}" class="form-control" th:classappend="${#fields.hasErrors('serverurl')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{serverurl}"></div>
        </div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/fido-clients} : @{/system/fido-clients/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
