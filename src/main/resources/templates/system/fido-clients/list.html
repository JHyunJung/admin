<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO 서버</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">FIDO 서버</h1><p class="fa-page-desc">어드민이 reload 를 보낼 FIDO 서버 목록입니다.</p></div>
    <div class="fa-page-actions">
      <!-- 확인은 브라우저 기본 대화상자가 아니라 공통 모달(admin.js 의 data-confirm-form)로 묻는다(README 규칙). -->
      <form method="post" th:action="@{/system/fido-clients/reload}" class="m-0" id="reloadForm">
        <button type="button" class="btn btn-outline-secondary"
                data-confirm-form="reloadForm"
                data-confirm-message="STATUS=ON 인 모든 FIDO 서버에 reload 를 보냅니다."
                data-confirm-ok="보내기"><i class="bi bi-arrow-repeat" aria-hidden="true"></i>지금 reload 보내기</button>
      </form>
      <a th:href="@{/system/fido-clients/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/system/fido-clients}" class="fa-filter">
    <div>
      <label class="form-label" for="f-servercode">코드</label>
      <input id="f-servercode" name="servercode" th:value="${search.servercode}" class="form-control">
    </div>
    <div>
      <label class="form-label" for="f-status">상태</label>
      <select id="f-status" name="status" class="form-select">
        <option value="">전체</option>
        <option value="ON" th:selected="${search.status == 'ON'}">ON</option>
        <option value="OFF" th:selected="${search.status == 'OFF'}">OFF</option>
      </select>
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/fido-clients}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th>코드</th><th>이름</th><th>URL</th><th>상태</th><th>수정일시</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono"><a th:href="@{/system/fido-clients/{id}(id=${r.servercode})}" th:text="${r.servercode}">코드</a></td>
            <td th:text="${r.servername}"></td>
            <td class="fa-mono" th:text="${#strings.abbreviate(r.serverurl, 60)}"></td>
            <td><span class="badge" th:classappend="${r.status == 'ON'} ? 'text-bg-success' : 'text-bg-danger'" th:text="${r.status}"></span></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.updatedtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(5, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
