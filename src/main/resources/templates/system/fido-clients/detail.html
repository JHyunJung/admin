<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>FIDO 서버 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/system/fido-clients}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|FIDO 서버 ${item.servercode}|">FIDO 서버</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/system/fido-clients/{id}/edit(id=${item.servercode})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/system/fido-clients/{id}/delete(id=${item.servercode})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: basicRows})}"></div>
</main>

<tbody th:fragment="basicRows">
  <tr><th>코드</th><td class="fa-mono" th:text="${item.servercode}"></td></tr>
  <tr><th>이름</th><td th:text="${item.servername}"></td></tr>
  <tr><th>URL</th><td class="fa-mono" th:text="${item.serverurl}"></td></tr>
  <tr><th>상태</th><td th:text="${item.status}"></td></tr>
  <tr><th>등록일시</th><td class="fa-mono" th:text="${#temporals.format(item.createdtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
  <tr><th>수정일시</th><td class="fa-mono" th:text="${#temporals.format(item.updatedtime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
</tbody>
</body>
</html>
