<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>에러 코드 상세</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div>
      <a class="fa-back" th:href="@{/system/error-codes}"><i class="bi bi-arrow-left" aria-hidden="true"></i>목록</a>
      <div class="fa-title-row">
        <h1 class="h4" th:text="|에러 코드 ${item.errorCode}|">에러 코드</h1>
      </div>
    </div>
    <div class="fa-page-actions">
      <a th:href="@{/system/error-codes/{id}/edit(id=${item.errorCode})}" class="btn btn-outline-secondary">수정</a>
      <form th:action="@{/system/error-codes/{id}/delete(id=${item.errorCode})}" method="post" id="deleteForm" class="m-0">
        <button type="button" class="btn btn-outline-danger" data-confirm-form="deleteForm">삭제</button>
      </form>
    </div>
  </div>
  <div th:replace="~{fragments/detail-section :: section('기본 정보', ~{this :: basicRows})}"></div>
</main>

<!-- 구획 내용 정의. main 밖에 두어야 카드 밖에 중복 출력되지 않는다. -->
<tbody th:fragment="basicRows">
  <tr><th>코드</th><td class="fa-mono" th:text="${item.errorCode}"></td></tr>
  <tr><th>메시지</th><td th:text="${item.errorMessage}"></td></tr>
  <tr><th>설명</th><td class="fa-pre" th:text="${item.errorComment}"></td></tr>
  <tr><th>유형</th><td th:text="${item.errorType}"></td></tr>
</tbody>
</body>
</html>
