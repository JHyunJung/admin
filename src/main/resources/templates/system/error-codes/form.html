<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '에러 코드 등록' : '에러 코드 수정'">에러 코드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '에러 코드 등록' : '에러 코드 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/error-codes} : @{/system/error-codes/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="errorCode">코드 <span class="fa-req">*</span></label>
          <input th:field="*{errorCode}" class="form-control" th:readonly="${!isNew}"
                 th:classappend="${#fields.hasErrors('errorCode')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{errorCode}"></div>
        </div>
        <div class="col-md-4"><label class="form-label" for="errorType">유형</label><input th:field="*{errorType}" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="errorMessage">메시지</label><input th:field="*{errorMessage}" class="form-control"></div>
        <div class="col-12"><label class="form-label" for="errorComment">설명</label><textarea th:field="*{errorComment}" rows="4" class="form-control"></textarea></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/error-codes} : @{/system/error-codes/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
