<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>에러 코드</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">에러 코드</h1><p class="fa-page-desc">FIDO 서버가 돌려주는 에러 코드와 메시지를 관리합니다.</p></div>
    <div class="fa-page-actions">
      <a th:href="@{/system/error-codes/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>
  <form method="get" th:action="@{/system/error-codes}" class="fa-filter">
    <div><label class="form-label" for="f-errorCode">코드</label><input id="f-errorCode" name="errorCode" th:value="${search.errorCode}" class="form-control"></div>
    <div><label class="form-label" for="f-errorType">유형</label><input id="f-errorType" name="errorType" th:value="${search.errorType}" class="form-control"></div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/error-codes}" class="btn btn-link">초기화</a>
    </div>
  </form>
  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light"><tr><th>코드</th><th>메시지</th><th>유형</th><th>설명</th></tr></thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono"><a th:href="@{/system/error-codes/{id}(id=${r.errorCode})}" th:text="${r.errorCode}">코드</a></td>
            <td th:text="${r.errorMessage}"></td>
            <td><span class="badge text-bg-secondary" th:text="${r.errorType}"></span></td>
            <td th:text="${#strings.abbreviate(r.errorComment, 60)}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(4, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div class="fa-table-foot">
      <span th:text="|총 ${page.totalElements}건|"></span>
      <div th:replace="~{fragments/pagination :: pagination(${page}, ${basePath})}"></div>
    </div>
  </div>
</main>
</body>
</html>
