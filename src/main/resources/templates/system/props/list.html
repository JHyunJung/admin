<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>시스템 설정</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div class="fa-page-head">
    <div><h1 class="h4">시스템 설정</h1></div>
    <div class="fa-page-actions">
      <a th:href="@{/system/props/new}" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>등록</a>
    </div>
  </div>

  <form method="get" th:action="@{/system/props}" class="fa-filter">
    <div>
      <label class="form-label" for="f-propKey">키</label>
      <input id="f-propKey" name="propKey" th:value="${search.propKey}" class="form-control">
    </div>
    <div class="fa-filter-actions">
      <button class="btn btn-primary"><i class="bi bi-search" aria-hidden="true"></i>검색</button>
      <a th:href="@{/system/props}" class="btn btn-link">초기화</a>
    </div>
  </form>

  <div class="fa-table-card">
    <div class="table-responsive">
      <table class="table table-hover fa-table mb-0">
        <thead class="table-light">
          <tr><th>키</th><th>값</th><th>공유</th><th>수정일시</th></tr>
        </thead>
        <tbody>
          <tr th:each="r : ${page.content}">
            <td class="fa-mono"><a th:href="@{/system/props/{id}(id=${r.pathValue})}" th:text="${r.propKey}">키</a></td>
            <td th:text="${#strings.abbreviate(r.propValue, 60)}"></td>
            <td th:text="${r.shareType}"></td>
            <td class="text-nowrap fa-mono" th:text="${#temporals.format(r.updatedtime, 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          <th:block th:if="${page.totalElements == 0}"><tr th:replace="~{fragments/empty-state :: row(4, '데이터가 없습니다.')}"></tr></th:block>
        </tbody>
      </table>
    </div>
    <div th:replace="~{fragments/list-footer :: footer(${page}, ${basePath})}"></div>
  </div>
</main>
</body>
</html>
