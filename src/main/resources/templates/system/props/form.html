<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '시스템 설정 등록' : '시스템 설정 수정'">시스템 설정</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '시스템 설정 등록' : '시스템 설정 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/props} : @{/system/props/{id}(id=${id.toPathValue()})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="propKey">키 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <input th:field="*{propKey}" class="form-control fa-mono" th:readonly="${!isNew}"
                 th:classappend="${#fields.hasErrors('propKey')} ? 'is-invalid'">
          <div class="form-text">영문, 숫자, 마침표(.), 밑줄(_), 하이픈(-) 만 사용할 수 있습니다.</div>
          <div class="invalid-feedback" th:errors="*{propKey}"></div>
        </div>
        <!-- 고객사는 세션이 선택한 유효 테넌트로 컨트롤러가 채운다(등록·수정 모두 식별자는 여기서 다루지 않는다). -->
        <div class="col-md-3">
          <label class="form-label" for="shareType">공유 <span class="fa-req" aria-hidden="true">*</span><span class="visually-hidden">(필수)</span></label>
          <select th:field="*{shareType}" class="form-select"><option value="NO">NO</option><option value="YES">YES</option></select>
        </div>
        <div class="col-12"><label class="form-label" for="propValue">값</label><textarea th:field="*{propValue}" rows="4" class="form-control"></textarea></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/props} : @{/system/props/{id}(id=${id.toPathValue()})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
