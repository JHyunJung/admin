<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${isNew} ? '시스템 정보 등록' : '시스템 정보 수정'">시스템 정보</title></head>
<body>
<main class="d-flex flex-column gap-4">
  <div th:replace="~{fragments/page-header :: header(${isNew} ? '시스템 정보 등록' : '시스템 정보 수정', null)}"></div>
  <form th:action="${isNew} ? @{/system/info} : @{/system/info/{id}(id=${id})}" th:object="${form}" method="post"
        class="fa-form-card">
    <div class="fa-form-body">
      <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div><div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="propKey">키 <span class="fa-req">*</span></label>
          <input th:field="*{propKey}" class="form-control" th:readonly="${!isNew}"
                 th:classappend="${#fields.hasErrors('propKey')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{propKey}"></div>
        </div>
        <div class="col-12"><label class="form-label" for="propValue">값</label><textarea th:field="*{propValue}" rows="3" class="form-control"></textarea></div>
      </div>
    </div>
    <div class="fa-form-actions">
      <a th:href="${isNew} ? @{/system/info} : @{/system/info/{id}(id=${id})}" class="btn btn-outline-secondary">취소</a>
      <button class="btn btn-primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
