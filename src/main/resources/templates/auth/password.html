<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>내 비밀번호 변경</title></head>
<body>
<main>
  <div class="fa-page-head"><div>
    <h1 class="h4">내 비밀번호 변경</h1>
  </div></div>
  <div class="alert alert-warning d-flex align-items-start gap-2" th:if="${expiredDays != null}">
    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
    <div th:text="|비밀번호를 변경한 지 ${expiredDays}일이 지났습니다. 새 비밀번호로 변경하세요.|"></div>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start">
    <form th:action="@{/me/password}" th:object="${form}" method="post" class="fa-form-card" style="flex: 1 1 420px">
      <div class="fa-form-body">
        <div class="mb-3">
          <label class="form-label">현재 비밀번호 <span class="fa-req">*</span></label>
          <input type="password" th:field="*{currentPassword}" class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" autocomplete="current-password">
          <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">새 비밀번호 <span class="fa-req">*</span></label>
          <input type="password" th:field="*{newPassword}" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{newPassword}"></div>
          <div class="form-text">8~64자, 영문 대문자·소문자·숫자·특수문자 포함</div>
        </div>
        <div class="mb-3">
          <label class="form-label">새 비밀번호 확인 <span class="fa-req">*</span></label>
          <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
      </div>
      <div class="fa-form-actions">
        <button class="btn btn-primary">변경</button>
      </div>
    </form>
    <aside class="fa-card p-4" style="flex: 1 1 280px; max-width: 360px">
      <img th:src="@{/img/ill/password.webp}" alt="" width="160" height="120">
      <p class="small text-secondary mt-3 mb-0">8~64자, 영문 대문자·소문자·숫자·특수문자 포함</p>
    </aside>
  </div>
</main>
</body>
</html>
