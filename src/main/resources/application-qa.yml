# QA. 로그는 콘솔과 파일 둘 다(logback-spring.xml 의 qa 프로필). 앱 로그는 DEBUG 라 재현·분석에 쓴다.
spring:
  # DB 접속 정보는 환경 변수로만 받는다 — 기본값 없음(없으면 기동 실패). 비밀번호를 이 파일에 적지 않는다.
  #   SPRING_DATASOURCE_URL      예) jdbc:oracle:thin:@qa-db.example.local:1521/KBFIDO
  #   SPRING_DATASOURCE_USERNAME
  #   SPRING_DATASOURCE_PASSWORD
  # 값은 평문, ENC(...) 암호문, [plain]평문 중 하나. ENC(...) 는 DataSourceConfig 가 DB_CONFIG_KEY 로 복호화한다.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: fido-admin-qa
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000      # 풀에서 커넥션을 기다리는 최대 시간(ms)
      validation-timeout: 5000
      idle-timeout: 300000           # 5분 쉬면 반납
      max-lifetime: 1800000          # 30분 — DB·방화벽의 유휴 연결 끊김보다 짧게
      leak-detection-threshold: 20000  # 20초 넘게 안 돌려준 커넥션을 WARN 으로 알림(QA 에서 누수 찾기)
      # connection-test-query 는 두지 않는다. ojdbc 는 JDBC4 isValid() 를 지원하므로 Hikari 가 그것으로 검사하며,
      # SELECT 문 검증보다 가볍다.
  jpa:
    show-sql: false
  thymeleaf:
    cache: true
# 세션 쿠키 플래그(HttpOnly/Secure/SameSite)는 application.yml 의 기본값을 그대로 쓴다.
server:
  error:
    include-stacktrace: never
    # QA 는 재현·분석용이라 JSON 오류 응답에 예외 메시지를 남긴다(기본값 never 를 덮어쓴다). 운영은 숨긴다.
    include-message: always
logging:
  level:
    com.crosscert.fidoadmin: debug
    org.springframework: info
    org.hibernate: info
fido-admin:
  # DB 접속 정보 복호화 키(AES-256, Base64 32바이트). SPRING_DATASOURCE_* 에 ENC(...) 를 쓸 때만 필요하다.
  #   DB_CONFIG_KEY
  db-config-key: ${DB_CONFIG_KEY:}
