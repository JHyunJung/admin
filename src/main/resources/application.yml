spring:
  application:
    name: fido-admin
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        default_batch_fetch_size: 50
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d
      # 정적 자원 URL 에 콘텐츠 해시를 붙인다(/css/admin-<hash>.css). max-age 1d 캐시가 있어도
      # 배포 후 새 CSS/JS 가 바로 반영된다. Thymeleaf @{...} 링크가 자동으로 버전 경로를 쓴다.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      # 쿠키 보호 플래그는 프로필과 무관하게 기본값으로 둔다. 프로필을 지정하지 않은 기동(= 운영으로 취급,
      # logback-spring.xml 과 같은 판단)에서도 Secure/SameSite 가 빠지지 않게 하려는 것이다.
      # local 만 http 라 secure 를 끈다(application-local.yml).
      cookie:
        http-only: true
        secure: true
        same-site: lax
  # 오류 응답에 예외 정보를 싣지 않는다. 화면은 error/*.html 이 그리고, JSON 요청(BasicErrorController)에도 메시지를 숨긴다.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
fido-admin:
  # DB 접속 정보 복호화 키(환경 변수 DB_CONFIG_KEY). 프로필 미지정 때의 기본값 — 각 프로필 yml 에도 같은 항목이 있다.
  db-config-key: ${DB_CONFIG_KEY:}
  page-size: 20
  password-fail-limit: 5
  # 비밀번호 만료. auto: 처음 필요할 때 CCFA_MANAGER.LAST_PW_CHANGE_DATE 열이 있는지 보고 있으면 켠다. false: 끈다.
  password-expiry:
    enabled: auto
