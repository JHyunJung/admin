spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: kbfido
    password: kbfido
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
server:
  servlet:
    session:
      cookie:
        # 로컬은 http://localhost 라 Secure 쿠키를 브라우저가 보내지 않는다. 여기서만 끈다.
        secure: false
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
fido-admin:
  # 로컬 도커 DB 는 평문이라 키가 없어도 된다. ENC(...) 로 바꿔 시험할 때만 DB_CONFIG_KEY 를 준다.
  db-config-key: ${DB_CONFIG_KEY:}
